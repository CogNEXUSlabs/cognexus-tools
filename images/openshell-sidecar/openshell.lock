# The openshell CLI the image carries: NVIDIA's static builds of one OpenShell
# release, each named by the SHA-256 its openshell-checksums-sha256.txt lists
# (and the release API's asset digest). The sidecar lists every sandbox with
# it, and asks the gateway its release, beside a gateway under Docker Compose.
#
# fetch_openshell.py downloads both into openshell/ and checks them; the
# Dockerfile checks them again (sha256sum -c) and fetches nothing itself.
# To move to another release, take both values from that release's checksums
# file and cross-check them against the release API before editing any line.
# release: 0.1.3
# from: https://github.com/NVIDIA/OpenShell/releases/download/v0.1.3/
