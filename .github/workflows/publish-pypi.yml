name: Publish Python SDK (artzain)

# Publishes artzain to PyPI. Trigger by pushing a tag like python-v0.3.1
# (must match python/pyproject.toml version), or run manually.
#
# Prefer a pending Trusted Publisher (PyPI project artzain, workflow
# publish-pypi.yml, Environment blank — this file has no `environment:`).
# Do not pass password: secrets.PYPI_API_TOKEN unless that secret is set;
# an empty password skips OIDC. Token fallback: add
#   password: ${{ secrets.PYPI_API_TOKEN }}
# under the publish step. Do not reuse a bare v* tag.

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publisher / OIDC, when configured on PyPI

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e ".[dev]" cryptography httpx

      - name: Run tests
        run: pytest -q

  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    # No GitHub Environment: pending publisher Environment must stay blank.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        working-directory: python
        run: |
          PKG_VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != pyproject.toml version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        working-directory: python
        run: python -m build

      - name: Validate distributions
        working-directory: python
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
          # Omit password so OIDC / Trusted Publisher is used. If using a
          # repo secret instead, add:
          #   password: ${{ secrets.PYPI_API_TOKEN }}
