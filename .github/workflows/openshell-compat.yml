name: OpenShell compatibility manifest

# Publishes openshell/openshell-compat.json, signed: which artzain release
# passed conformance with which OpenShell release, and the SHA-256 of each
# artzain release's connect script. The engine keeps the manifest
# (integrations/openshell/compat/, written by its openshell-releases.yml)
# and the seed copies it here. `artzain connect openshell upgrade` reads it
# from the newest compat-v<serial> release, verifies the signature, refuses
# a serial lower than the last it read, and moves a gateway only to a pair
# it lists.
#
#   check    on a pull request that touches the manifest, and on any dispatch:
#            the manifest is well formed. Nothing is signed.
#
#   sign     on a `compat-v<serial>` tag only, whose serial must be the
#            file's: sign the manifest keyless (cosign sign-blob), as this
#            workflow at that tag, and verify the bundle before it leaves
#            the job.
#
#   release  with contents: write and no OIDC token: attach the manifest
#            and its bundle to the tag's release.
#
# So the order is: the engine merges a compatibility change; it is seeded
# here and merged; then `compat-v<serial>` is tagged on that merge.
#
# What `upgrade` checks, and a customer can:
#
#   cosign verify-blob --bundle openshell-compat.json.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/CogNEXUSlabs/cognexus-tools/\.github/workflows/openshell-compat\.yml@refs/tags/compat-v[0-9]+$' \
#     openshell-compat.json
#
# The sign job runs in the `release` environment, like every job here that
# can publish under our name: its tag rules and required reviewer are the
# mirror's settings, and compat-v* needs a tag rule there.
#
# Third-party actions are pinned to commit SHAs, not tags. cosign 2.x is the
# release sidecar-image.yml installs, for the same reasons.

on:
  push:
    tags:
      - "compat-v*"
  pull_request:
    paths:
      - "openshell/**"
      - ".github/workflows/openshell-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The engine's compat.py writes the manifest and checks it the same
      # way; this repeats the shape here so a manifest that is not one is
      # never signed.
      - name: The manifest is well formed
        run: |
          python3 - openshell/openshell-compat.json <<'EOF'
          import json, re, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          found = []
          if manifest.get("kind") != "artzain.openshell.compat" or manifest.get("version") != 2:
              found.append("not an artzain.openshell.compat version 2 manifest")
          serial = manifest.get("serial")
          if isinstance(serial, bool) or not isinstance(serial, int) or serial < 1:
              found.append("serial is not a whole number from 1")
          keys = {"artzain", "openshell", "verified", "conformance_run", "connect_script_sha256"}
          pairs = manifest.get("pairs")
          if not isinstance(pairs, list) or not pairs:
              found.append("no pairs")
          for i, pair in enumerate(pairs if isinstance(pairs, list) else []):
              if not isinstance(pair, dict) or set(pair) != keys:
                  found.append(f"pair {i} does not have exactly {sorted(keys)}")
                  continue
              for key in ("artzain", "openshell"):
                  if not re.fullmatch(r"\d+\.\d+\.\d+", str(pair[key])):
                      found.append(f"pair {i}: {key} is not major.minor.patch")
              if not re.fullmatch(r"[0-9a-f]{64}", str(pair["connect_script_sha256"])):
                  found.append(f"pair {i}: connect_script_sha256 is not a SHA-256")
          for problem in found:
              print(f"::error::{problem}")
          if found:
              sys.exit(1)
          print(f"serial {serial}: {len(pairs)} pair(s)")
          EOF

  sign:
    name: Sign the manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check
    # Only a compat-v* tag signs, pushed or dispatched.
    if: startsWith(github.ref, 'refs/tags/compat-v')
    environment: release
    permissions:
      contents: read
      id-token: write # keyless signing as this workflow at this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag names the serial `upgrade` compares with the last one it
      # read. A tag that is not the file's would sign one serial under
      # another's name.
      - name: Verify tag matches the manifest's serial
        run: |
          set -euo pipefail
          SERIAL="${GITHUB_REF_NAME#compat-v}"
          IN_FILE="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["serial"])' openshell/openshell-compat.json)"
          if [ "$SERIAL" != "$IN_FILE" ]; then
            echo "Tag serial ($SERIAL) != the manifest's serial ($IN_FILE)." >&2
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      - name: Sign the manifest and verify the bundle
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/openshell-compat.json.sigstore.json" \
            openshell/openshell-compat.json
          cosign verify-blob --bundle "$RUNNER_TEMP/openshell-compat.json.sigstore.json" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/openshell-compat.yml@${GITHUB_REF}" \
            openshell/openshell-compat.json
          cp openshell/openshell-compat.json "$RUNNER_TEMP/openshell-compat.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshell-compat
          path: |
            ${{ runner.temp }}/openshell-compat.json
            ${{ runner.temp }}/openshell-compat.json.sigstore.json
          if-no-files-found: error

  # A SEPARATE job on purpose, as in publish-pypi.yml: contents:write and
  # id-token:write never meet. The token is the run's ephemeral github.token.
  github-release:
    name: Attach to the tag's release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: sign
    if: github.ref_type == 'tag'
    permissions:
      contents: write # create the tag's release and attach two files; NO id-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openshell-compat
          path: ${{ runner.temp }}/signed

      # Idempotent: an existing release is reused, and --clobber lets a
      # re-run attach the same files again. --latest=false: the artzain
      # release keeps the repository's badge.
      - name: Create the release and attach the manifest and its bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "OpenShell compatibility manifest ${GITHUB_REF_NAME#compat-v}" \
              --notes "The pairs of artzain and OpenShell releases that passed conformance together, signed for \`artzain connect openshell upgrade\`." \
              --verify-tag --latest=false
          fi
          cd "$RUNNER_TEMP/signed"
          gh release upload "$GITHUB_REF_NAME" openshell-compat.json openshell-compat.json.sigstore.json --clobber
