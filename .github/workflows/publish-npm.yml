name: Publish TypeScript SDK

# Publishes @cognexuslabs/artzain to npm via OIDC Trusted Publishing — no
# long-lived npm token. Trigger by pushing a tag like sdk-ts-v0.1.0 (must match
# package.json version), or run manually from the Actions tab.
#
# One-time setup on npmjs.com (Package @cognexuslabs/artzain → Settings →
# Trusted Publisher / Publishing access), bound to:
#   organization/user : CogNEXUSlabs
#   repository        : cognexus-tools
#   workflow filename : publish-npm.yml   (filename only, not the path)
#   environment       : (leave blank — this job uses none)
#   allowed actions   : npm publish
# npm then mints a short-lived credential from the id-token below at publish
# time and generates provenance automatically (no --provenance flag needed, no
# NPM_TOKEN secret). This removes the last long-lived publishing credential in
# the release path, matching PyPI's Trusted-Publisher setup.
#
# Requirements: npm CLI >= 11.5.1 and Node >= 22.14.0. Node 22 ships npm 10.x,
# so npm is upgraded below. Actions are pinned to commit SHAs (WS-8).

on:
  push:
    tags:
      - "sdk-ts-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (mints the publish credential + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # resolves to latest 22.x (>= 22.14.0, required for OIDC)
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      # (Consider pinning an exact version for WS-8 once a floor is chosen.)
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token via the configured
      # trusted publisher, and provenance is generated automatically.
      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish
