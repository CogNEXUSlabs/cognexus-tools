name: Publish TypeScript SDK

# Publishes @cognexuslabs/artzain to npm with provenance attestation.
# Trigger by pushing a tag like sdk-ts-v0.1.0 (must match package.json version),
# or run manually from the Actions tab.
#
# Required repo secret: NPM_TOKEN — a granular automation token with publish
# rights on @cognexuslabs/artzain.
#
# Actions are pinned to commit SHAs, not tags (WS-8). A tag is a mutable
# pointer, and every action in this job runs alongside NPM_TOKEN — a
# credential with publish rights on the package.
#
# NPM_TOKEN is the last long-lived publishing credential in the release path.
# npm now supports OIDC Trusted Publishing; moving to it would remove this
# secret the way PyPI's already is. That needs a change on npmjs.com, so it is
# noted in docs/runbooks/supply-chain.md rather than assumed here.

on:
  push:
    tags:
      - "sdk-ts-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm --provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
