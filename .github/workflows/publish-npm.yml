name: Publish npm packages

# Publishes this repo's npm packages via OIDC Trusted Publishing — no
# long-lived npm token. One workflow file on purpose: every package's
# trusted-publisher binding on npmjs.com names this same filename.
#
# Tag prefixes are disjoint (never bare v*), and each tag must match the
# package.json version it publishes:
#   sdk-ts-v*    -> typescript/  @cognexuslabs/artzain
#   openclaw-v*  -> openclaw/    @cognexuslabs/openclaw-artzain
#   n8n-v*       -> n8n/         @cognexuslabs/n8n-nodes-artzain
#
# One-time setup on npmjs.com PER PACKAGE (Settings → Trusted Publisher /
# Publishing access), bound to:
#   organization/user : CogNEXUSlabs
#   repository        : cognexus-tools
#   workflow filename : publish-npm.yml   (filename only, not the path)
#   environment       : (leave blank — these jobs use none)
#   allowed actions   : npm publish
# npm then mints a short-lived credential from the id-token below at publish
# time and generates provenance automatically (no --provenance flag needed, no
# NPM_TOKEN secret).
#
# FIRST publish of a NEW package cannot use Trusted Publishing: npm only binds
# a trusted publisher to a package that already exists (re-verified against
# docs.npmjs.com on 23 Aug 2026). Bootstrap is an owner step — see the engine
# repo's scripts/cognexus-tools-seed/APPLY.md. A tag pushed before the
# bootstrap fails the publish step with an auth error and ships nothing; after
# binding, re-run it from the Actions tab.
#
# Requirements: npm CLI >= 11.5.1 and Node >= 22.14.0. Node 22 ships npm 10.x,
# so npm is upgraded below. Actions are pinned to commit SHAs (WS-8).

on:
  push:
    tags:
      - "sdk-ts-v*"
      - "openclaw-v*"
      - "n8n-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (tag pushes select automatically)"
        type: choice
        options:
          - typescript
          - openclaw
          - n8n
        default: typescript

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (mints the publish credential + provenance)

jobs:
  typescript:
    name: "@cognexuslabs/artzain"
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'sdk-ts-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'typescript')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # resolves to latest 22.x (>= 22.14.0, required for OIDC)
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token via the configured
      # trusted publisher, and provenance is generated automatically.
      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish

  # GitHub-release mirror jobs (one per package, tag-gated like their publish
  # jobs; the repository's Releases page went stale at artzain 0.6.0 while
  # PyPI served 0.6.4 and was backfilled by hand on 2026-08-28). SEPARATE
  # jobs on purpose — a job-level permissions block REPLACES the top-level
  # one, so these get contents:write and deliberately NO id-token: a release
  # job cannot mint a publish credential, and the publish jobs never gain
  # contents:write. Notes come from the package's CHANGELOG section where one
  # exists, else a provenance pointer. Always --latest=false: artzain
  # (publish-pypi.yml) holds the repository's Latest badge, and batch-created
  # releases were observed stealing it.
  typescript-release:
    name: "GitHub release: @cognexuslabs/artzain"
    needs: typescript
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'sdk-ts-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release object; NO id-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          VERSION="${GITHUB_REF_NAME#sdk-ts-v}"
          if [ -f typescript/CHANGELOG.md ]; then
            awk -v ver="$VERSION" '$0 == "## " ver {f=1; next} /^## /{f=0} f' \
              typescript/CHANGELOG.md > /tmp/notes.md
          fi
          if ! [ -s /tmp/notes.md ]; then
            echo "npm package [@cognexuslabs/artzain](https://www.npmjs.com/package/@cognexuslabs/artzain) — published via Trusted Publishing with Sigstore provenance (\`npm audit signatures\` verifies)." > /tmp/notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "@cognexuslabs/artzain ${VERSION}" \
            --notes-file /tmp/notes.md \
            --verify-tag --latest=false

  openclaw:
    name: "@cognexuslabs/openclaw-artzain"
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'openclaw-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'openclaw')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openclaw
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # resolves to latest 22.x (>= 22.14.0, required for OIDC)
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#openclaw-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish

  openclaw-release:
    name: "GitHub release: @cognexuslabs/openclaw-artzain"
    needs: openclaw
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'openclaw-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release object; NO id-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          VERSION="${GITHUB_REF_NAME#openclaw-v}"
          if [ -f openclaw/CHANGELOG.md ]; then
            awk -v ver="$VERSION" '$0 == "## " ver {f=1; next} /^## /{f=0} f' \
              openclaw/CHANGELOG.md > /tmp/notes.md
          fi
          if ! [ -s /tmp/notes.md ]; then
            echo "npm package [@cognexuslabs/openclaw-artzain](https://www.npmjs.com/package/@cognexuslabs/openclaw-artzain) — published via Trusted Publishing with Sigstore provenance (\`npm audit signatures\` verifies)." > /tmp/notes.md
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "@cognexuslabs/openclaw-artzain ${VERSION}" \
            --notes-file /tmp/notes.md \
            --verify-tag --latest=false

  n8n:
    name: "@cognexuslabs/n8n-nodes-artzain"
    if: >-
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'n8n-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.package == 'n8n')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # resolves to latest 22.x (>= 22.14.0, required for OIDC)
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#n8n-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm (OIDC Trusted Publishing)
        run: npm publish

  n8n-release:
    name: "GitHub release: @cognexuslabs/n8n-nodes-artzain"
    needs: n8n
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release object; NO id-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          VERSION="${GITHUB_REF_NAME#n8n-v}"
          if [ -f n8n/CHANGELOG.md ]; then
            awk -v ver="$VERSION" '$0 == "## " ver {f=1; next} /^## /{f=0} f'               n8n/CHANGELOG.md > /tmp/notes.md
          fi
          if ! [ -s /tmp/notes.md ]; then
            echo "npm package [@cognexuslabs/n8n-nodes-artzain](https://www.npmjs.com/package/@cognexuslabs/n8n-nodes-artzain) — published via Trusted Publishing with Sigstore provenance (\`npm audit signatures\` verifies)." > /tmp/notes.md
          fi
          gh release create "$GITHUB_REF_NAME"             --title "@cognexuslabs/n8n-nodes-artzain ${VERSION}"             --notes-file /tmp/notes.md             --verify-tag --latest=false
