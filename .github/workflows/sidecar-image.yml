name: OpenShell sidecar image

# Builds the ArtzAIn sidecar for an NVIDIA OpenShell gateway as an image
# (images/openshell-sidecar/), and on a release tag publishes it to GHCR,
# signed and with an SBOM attestation.
#
# Two things happen here, and only the second needs a credential:
#
#   rehearse  on a pull request that touches the image or python/, and on any
#             dispatch: build a wheel from this repository's python/ tree,
#             build the image from that wheel, and run it
#             (images/openshell-sidecar/test_image.py). Nothing is pushed.
#
#   publish   on a `sidecar-v<version>` tag only: build the image from the
#             wheel PyPI serves for that version, named by its SHA-256 in
#             images/openshell-sidecar/artzain.lock; push it for linux/amd64
#             and linux/arm64; run what was pushed; then sign its digest and
#             attest an SPDX SBOM to it, keyless, as this workflow at that
#             tag.
#
# So the order of a release is: `python-v<version>` is on PyPI; artzain.lock
# is written for it (scripts/lock_openshell_sidecar_image.py --artzain, in
# the engine repository) and seeded here; then `sidecar-v<version>` is
# tagged. A tag whose version artzain.lock does not name fails before
# anything is built.
#
# What a customer checks (docs: the engine's supply-chain runbook):
#
#   cosign verify ghcr.io/cognexuslabs/artzain-openshell-sidecar@sha256:<digest> \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/CogNEXUSlabs/cognexus-tools/\.github/workflows/sidecar-image\.yml@refs/tags/sidecar-v[0-9]+\.[0-9]+\.[0-9]+$'
#
# The publish job runs in the `release` environment, like every job here
# that can publish under our name: its tag rules and required reviewer are
# the mirror's settings. A new tag prefix needs a tag rule there.
#
# Third-party actions are pinned to commit SHAs, not tags. A tag is a mutable
# pointer, and every action in the publish job runs beside a token that can
# push the image and an OIDC token that can sign it.
#
# cosign 2.x and the checksum-pinned syft are the engine's choices
# (core-image.yml there), for the reasons recorded there: the admission
# controllers customers run read the signature layout 2.x writes, and syft's
# own installer action runs a script from a branch.

on:
  push:
    tags:
      - "sidecar-v*"
  pull_request:
    paths:
      - "images/**"
      - "python/**"
      - ".github/workflows/sidecar-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    name: Build from this tree and run it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned, hatchling (pyproject's build backend) included, as in
      # publish-pypi.yml: --no-isolation builds with the hatchling installed
      # here.
      - name: Install build tools
        run: pip install build==1.6.1 hatchling==1.32.4

      - name: Build the wheel from python/
        id: wheel
        run: |
          set -euo pipefail
          python -m build --wheel --no-isolation --outdir images/openshell-sidecar/wheels python
          VERSION="$(sed -n 's/^__version__ = "\([0-9.]*\)"$/\1/p' python/src/artzain/__init__.py)"
          test -f "images/openshell-sidecar/wheels/artzain-${VERSION}-py3-none-any.whl"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the image from that wheel
        env:
          VERSION: ${{ steps.wheel.outputs.version }}
        run: |
          docker build \
            --build-arg ARTZAIN_SOURCE=wheel \
            --build-arg "ARTZAIN_VERSION=${VERSION}" \
            --tag artzain-openshell-sidecar:rehearsal \
            images/openshell-sidecar

      - name: Run the image
        env:
          VERSION: ${{ steps.wheel.outputs.version }}
        run: python images/openshell-sidecar/test_image.py artzain-openshell-sidecar:rehearsal --version "$VERSION"

  publish:
    name: Publish, sign and attest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: rehearse
    # Only a sidecar-v* tag publishes, pushed or dispatched.
    if: startsWith(github.ref, 'refs/tags/sidecar-v')
    environment: release
    permissions:
      contents: read
      packages: write # push the image, its signature and its attestation to GHCR
      id-token: write # keyless signing as this workflow at this tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag names the artzain version the image holds, and artzain.lock
      # names the wheel. A tag the lock does not name would build either
      # nothing or another version under this tag's name.
      - name: Verify tag matches the locked artzain version
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#sidecar-v}"
          LOCKED="$(sed -n 's/^artzain==\([0-9][0-9.]*\) .*$/\1/p' images/openshell-sidecar/artzain.lock)"
          if [ "$LOCKED" != "$VERSION" ]; then
            echo "Tag version ($VERSION) != the version artzain.lock names (${LOCKED:-none})." >&2
            echo "Write the lock for a published version first: scripts/lock_openshell_sidecar_image.py --artzain $VERSION (engine repository), land it, re-seed." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/artzain-openshell-sidecar" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      # To bump: take the hash from syft_<ver>_checksums.txt on the release
      # page and cross-check it against the release API's asset digest before
      # editing either value. The engine's core-image.yml carries the same two
      # values, and a test there holds them together.
      - name: Install syft
        env:
          SYFT_VERSION: 1.51.0
          SYFT_SHA256: 2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/syft.tgz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tgz" -C "$RUNNER_TEMP" syft
          sudo install -m 0755 "$RUNNER_TEMP/syft" /usr/local/bin/syft
          syft version

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # GHCR tags can be moved, so the digest is what is signed and what a
      # customer pins. A version that is already there is not built again: a
      # second build is a second digest under the same tag, and the one
      # customers pinned would lose its name. A re-run picks up where the
      # first run stopped.
      - name: Publish the image for linux/amd64 and linux/arm64
        id: publish
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "${IMAGE}:${VERSION} is already published; not building it again"
            DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          else
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --build-arg ARTZAIN_SOURCE=pypi \
              --build-arg "ARTZAIN_VERSION=${VERSION}" \
              --tag "${IMAGE}:${VERSION}" \
              --provenance=false \
              --sbom=false \
              --metadata-file "$RUNNER_TEMP/image.metadata.json" \
              --push images/openshell-sidecar
            DIGEST="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.metadata.json")"
          fi
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::no digest for ${IMAGE}:${VERSION}"; exit 1 ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE}@${DIGEST}"

      # What is signed below is what ran here: the pushed digest, pulled back
      # for each platform. An image that fails this stays unsigned.
      # The runner's docker keeps one platform of an image pulled by digest,
      # and refuses to pull that digest for another ("cannot overwrite
      # digest"), so each platform's copy goes before the next is pulled.
      - name: Run what was published
        env:
          REF: ${{ steps.version.outputs.image }}@${{ steps.publish.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker pull --quiet --platform "$platform" "$REF"
            python3 images/openshell-sidecar/test_image.py "$REF" --version "$VERSION" --platform "$platform"
            docker image rm "$REF" > /dev/null
          done

      - name: Sign the image with cosign
        env:
          REF: ${{ steps.version.outputs.image }}@${{ steps.publish.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sidecar-image.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          verify() {
            cosign verify --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF" > /dev/null 2>&1
          }
          # Verify, then sign: a re-run does not add a second signature.
          if verify; then
            echo "Already signed: $REF"
            exit 0
          fi
          cosign sign --yes "$REF"
          # The registry can take a moment to serve what was just pushed.
          for _ in $(seq 1 12); do
            if verify; then
              echo "Signed and verified: $REF"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the signature for $REF did not become visible within 2 minutes"
          exit 1

      # syft reads the image back from the registry, by digest: the SBOM
      # describes what customers pull, not a local copy.
      - name: Attest an SPDX SBOM to the image
        env:
          REF: ${{ steps.version.outputs.image }}@${{ steps.publish.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sidecar-image.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          verify() {
            cosign verify-attestation --type spdxjson --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$REF" > /dev/null 2>&1
          }
          if verify; then
            echo "Already attested: $REF"
            exit 0
          fi
          SBOM="$RUNNER_TEMP/sidecar.spdx.json"
          syft "registry:${REF}" -o "spdx-json=${SBOM}"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
          for _ in $(seq 1 12); do
            if verify; then
              echo "Attested and verified: $REF"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the attestation for $REF did not become visible within 2 minutes"
          exit 1

      - name: Say what was published
        env:
          REF: ${{ steps.version.outputs.image }}@${{ steps.publish.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/sidecar-image.yml@${{ github.ref }}
        run: |
          {
            echo "### OpenShell sidecar image"
            echo
            echo "\`$REF\`"
            echo
            echo "Signed and attested as \`$IDENTITY\`."
          } >> "$GITHUB_STEP_SUMMARY"
