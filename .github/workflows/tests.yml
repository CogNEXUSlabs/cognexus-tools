# SDK suites — offline. Path filters so a Python-only PR does not wait on npm ci.
name: Tests

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # cryptography is NOT optional. Without it, Ed25519 audit-verify and
      # policy-sign tests skip and CI stays green. grpcio and protobuf (the
      # [openshell] extra) are not either: the OpenShell servicer tests import
      # them unconditionally under GitHub Actions.
      - name: Install test deps
        run: pip install pytest httpx cryptography pyyaml grpcio protobuf

      - name: Python SDK suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q

  # The Python files `artzain init` writes, run on the framework each one's
  # install line names; the suite above runs them with the framework stubbed,
  # which cannot see the framework's API change. The requirements are read
  # from the rendered file, and ARTZAIN_SCAFFOLD_FRAMEWORK makes a missing or
  # mismatched framework a failure instead of a skip. The newest release each
  # line allows is installed unpinned, so the checkout keeps no credential.
  python-scaffolds:
    name: Python scaffolds on their frameworks (${{ matrix.framework }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [crewai, langgraph, mcp]
    defaults:
      run:
        working-directory: python
    env:
      PYTHONPATH: src
      ARTZAIN_SCAFFOLD_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: python

      # CrewAI supports Python 3.10 to 3.13.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the scaffold's install line names
        run: |
          python tests/scaffold_install_line.py "$ARTZAIN_SCAFFOLD_FRAMEWORK" > "$RUNNER_TEMP/scaffold-requirements.txt"
          cat "$RUNNER_TEMP/scaffold-requirements.txt"
          pip install pytest packaging -r "$RUNNER_TEMP/scaffold-requirements.txt"

      - name: Run the rendered scaffold on it
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          OTEL_SDK_DISABLED: "true"
        run: python -m pytest tests/test_scaffolds_real_frameworks.py -q

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      # The npm and the step order of publish-npm.yml, which runs these
      # only on a release tag: a lockfile only one npm accepts, or a test
      # that changes once dist/ exists, would otherwise first fail there.
      - name: Use the publish job's npm
        run: npm install -g npm@12.1.0

      - name: Install
        run: npm ci

      - name: Build (tsc doubles as the type/lint gate)
        run: npm run build

      - name: Test
        run: npm test

  openclaw:
    name: OpenClaw plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: openclaw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openclaw/package-lock.json

      - name: Use the publish job's npm
        run: npm install -g npm@12.1.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  n8n:
    name: n8n nodes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: n8n
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: n8n/package-lock.json

      - name: Use the publish job's npm
        run: npm install -g npm@12.1.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  grokbot:
    name: Grok Bot skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: grokbot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grokbot/package-lock.json

      - name: Use the publish job's npm
        run: npm install -g npm@12.1.0

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
