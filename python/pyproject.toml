[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artzain"
# The version lives in src/artzain/__init__.py (`__version__`) and nowhere
# else; hatchling reads it from there ([tool.hatch.version] below), as do
# scripts/check_sdk_version.py and the bump in build-pypi.sh.
dynamic = ["version"]
description = "OWASP-aligned LLM prompt defence, runtime destructive-action guard, agent kill switch, and audit logging"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "CogNEXUS Labs", email = "hello@cognexuslabs.ai" },
]
maintainers = [
    { name = "CogNEXUS Labs", email = "hello@cognexuslabs.ai" },
]
keywords = [
    "llm",
    "security",
    "prompt-injection",
    "prompt-defense",
    "owasp",
    "ai-safety",
    "audit",
    "guardrails",
    "agent-kill-switch",
    "destructive-action-guard",
    "agent-safety",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Zero mandatory runtime dependencies — pure stdlib.
dependencies = []

[project.scripts]
artzain = "artzain.cli:main"

[project.optional-dependencies]
# Required only if you load custom detection patterns from YAML files via
# load_prompt_injection_config().
yaml = ["pyyaml>=6.0"]

# Required only for `artzain audit verify` Ed25519 signature checking. Leaf-hash,
# chain, and Merkle integrity verify with pure stdlib; signatures need this.
verify = ["cryptography>=41"]

# Required only for `artzain policy keygen|sign` — Ed25519 keypair generation
# and bundle signing happen client-side (private keys never leave your machine).
policy = ["cryptography>=41"]

dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "build",
    "twine",
    "pyyaml>=6.0",
]

[project.urls]
Homepage    = "https://github.com/CogNEXUSlabs/cognexus-tools"
Source      = "https://github.com/CogNEXUSlabs/cognexus-tools"
Issues      = "https://github.com/CogNEXUSlabs/cognexus-tools/issues"
Changelog   = "https://github.com/CogNEXUSlabs/cognexus-tools/releases"

[tool.hatch.version]
path = "src/artzain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/artzain"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "cognexus-logo.png",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"
# Src layout — required when pytest is run without PYTHONPATH=src (e.g. build-pypi.sh).
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/W/I gate this package in CI (`ruff check pypi-package`, tests.yml). `UP`
# (pyupgrade) is deliberately not selected: on 22 Aug 2026 it accounted for
# 213 of 242 findings, almost all `Optional[X]` -> `X | None` rewrites across
# the published modules. That is a mechanical modernisation pass worth doing
# on its own, not a gate - auto-fixing it under a gate would have produced an
# unreviewable diff in files that are mirrored byte-for-byte to the public
# repository (see scripts/check_security_sync.py). Same reasoning as the
# repository-root ruff.toml.
#
# B904 (raise inside except without `from`) and S110 (try/except/pass) were
# the last two non-`UP` residue rows (open-items 9.87: 7 + 17 findings,
# 5 Sep 2026). Both fixed and gated; tests/test_ruff_exception_hygiene.py
# pins them independently of this list.
select = ["E", "F", "W", "I", "B904", "S110"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The six security-core modules are byte-identical copies of
# application/security/ (scripts/check_security_sync.py; CI diffs them against
# the public mirror too). They are linted under application/'s ruff.toml, and
# a fix applied here alone would break the sync; so their residue is ignored
# here rather than fixed here.
"src/artzain/prompt_injection.py" = ["E741", "F401", "I001"]
"src/artzain/destructive_action_guard.py" = ["E741", "F401", "I001"]
"src/artzain/policy_enforcement.py" = ["E741", "F401", "I001"]
"src/artzain/prompt_defense.py" = ["E741", "F401", "I001"]
"src/artzain/pii_detector.py" = ["E741", "F401", "I001"]
"src/artzain/tool_call_contract.py" = ["E741", "F401", "I001"]
